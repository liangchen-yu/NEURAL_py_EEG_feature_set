[metadata]
name = NEURAL_py_EEG
version = 0.1.1
author = Brian Murphy
author_email = Brian.M.Murphy@umail.ucc.ie
description = A Neonatal EEG Pre-Processing and Feature Set in python
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/BrianMur92/NEURAL_py_EEG_feature_set
project_urls =
    Bug Tracker = https://github.com/BrianMur92/NEURAL_py_EEG_feature_set/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
# Lower bounds = the oldest versions tested, natively or in a web browser
# (Pyodide); see README, "Maintenance". Only Python 3.14 has been tested.
python_requires = >=3.14
install_requires =
    numpy>=2.4.6
    scipy>=1.18.0
    pandas>=2.3.3
    mne>=1.13.2
    matplotlib>=3.10.8
    pyedflib>=0.1.42

[options.packages.find]
where = src